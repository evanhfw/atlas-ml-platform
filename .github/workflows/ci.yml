name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: atlas
  POSTGRES_PASSWORD: atlas_dev_password
  POSTGRES_DB: atlas_dev
  S3_ACCESS_KEY: atlas
  S3_SECRET_KEY: atlas_s3_password
  S3_BUCKET: atlas-models-test
  TEST_DATABASE_URL: postgresql+asyncpg://atlas:atlas_dev_password@localhost:5432/atlas_test
  DATABASE_URL: postgresql+asyncpg://atlas:atlas_dev_password@localhost:5432/atlas_test

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Start PostgreSQL and SeaweedFS
        run: docker compose up -d --wait postgres seaweedfs

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Tests
        run: uv run pytest

      - name: Build production image
        run: docker build -t atlas-ml-platform:ci .

      - name: Stop dependencies
        if: always()
        run: docker compose down -v
