x-app-environment: &app-environment
  APP_ENV: production
  DEBUG: "false"
  DOCS_ENABLED: "false"
  AUTH_ENABLED: "true"
  API_KEY_READ: ${API_KEY_READ:-}
  API_KEY_WRITE: ${API_KEY_WRITE:-}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  S3_ENDPOINT: seaweedfs:8333
  S3_SECURE: "false"
  ARTIFACT_TRUST_POLICY: allowlist
  TRUSTED_ARTIFACT_CHECKSUMS: ${TRUSTED_ARTIFACT_CHECKSUMS:-}
  LOG_LEVEL: INFO
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  SHUTDOWN_GRACE_SECONDS: "20"

services:
  # One-shot migration job. `--profile app` makes Compose run it to completion
  # before starting the application container.
  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: atlas-ml-platform:${IMAGE_TAG:-local}
    container_name: atlas-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      <<: *app-environment
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: atlas-ml-platform:${IMAGE_TAG:-local}
    container_name: atlas-app
    restart: unless-stopped
    env_file:
      - .env
    environment: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: "2.0"
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    container_name: atlas-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - atlas_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  seaweedfs:
    image: chrislusf/seaweedfs@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    container_name: atlas-seaweedfs

    restart: unless-stopped

    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}

    entrypoint: ["/bin/sh", "/entrypoint.sh"]

    volumes:
      - atlas_seaweedfs_data:/data
      - ./docker/seaweedfs/entrypoint.sh:/entrypoint.sh:ro

    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9333/cluster/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  jaeger:
    image: jaegertracing/all-in-one@sha256:12fa17a231abded2c3b5b715bd252a043678495c588cbe772173991fbdcdf7c8
    container_name: atlas-jaeger

    restart: unless-stopped

    environment:
      COLLECTOR_OTLP_ENABLED: "true"

    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:16686/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038
    container_name: atlas-prometheus

    restart: unless-stopped
    # Host networking lets Prometheus scrape the locally running uvicorn
    # process at 127.0.0.1:8000. This is a Linux development setup.
    network_mode: host

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"

    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - atlas_prometheus_data:/prometheus

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    container_name: atlas-grafana

    restart: unless-stopped
    network_mode: host

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3002"

    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - atlas_grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3002/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

volumes:
  atlas_postgres_data:
  atlas_seaweedfs_data:
  atlas_prometheus_data:
  atlas_grafana_data:
